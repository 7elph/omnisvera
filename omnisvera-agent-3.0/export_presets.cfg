[preset.0]
name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/sprites/*.json,assets/ui/*.json,assets/rom2_local/*.json,assets/city/*.json"
exclude_filter="tools/*,tests/*,docs/*,build/*,assets/original/*.png,README.md,*.py,*.ps1"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://index.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/icon_144x144="res://assets/pwa/icon-144.png"
progressive_web_app/icon_180x180="res://assets/pwa/icon-180.png"
progressive_web_app/icon_512x512="res://assets/pwa/icon-512.png"
progressive_web_app/background_color=Color(0.043, 0.031, 0.024, 1)
