<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Omnisvera AI Console v0.1</title>
<link rel="stylesheet" href="style.css"/>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
<header>
  <div class="title">OMNISVERA AI CONSOLE <span class="ver">v0.1</span></div>
  <div class="status">
    <span id="s-ollama">Ollama: …</span>
    <span id="s-mcp">MCP: …</span>
    <span id="s-tools">Tools: …</span>
    <select id="modelSelect"><option value="gpt-oss:20b-cloud">gpt-oss:20b-cloud</option><option value="gpt-oss:120b-cloud">gpt-oss:120b-cloud</option></select>
  </div>
</header>

<div class="layout">
  <aside id="toolsPanel">
    <h3>TOOLS <span id="toolsCount"></span></h3>
    <div id="toolsList"></div>
    <label class="showRawLabel"><input type="checkbox" id="showRaw"/> Show raw tool results</label>
  </aside>

  <main>
    <div id="mobileControls">
      <label class="showRawLabel mobile"><input type="checkbox" id="showRawMobile"/> Show raw tool results</label>
    </div>
    <div id="chat"></div>
    <div id="progressWrap" class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
    <div id="progressMeta" class="progress-meta" style="display:none"></div>
    <div class="composer">
      <textarea id="input" placeholder="Escreva aqui...  (ex: Continue o predictor football.elo do Omnisvera a partir do estado persistido. Descubra pelo próprio Omnisvera tudo que precisar.)" rows="3"></textarea>
      <div class="actions">
        <button id="sendBtn">Enviar</button>
        <button id="clearBtn" class="secondary">Clear Conversation</button>
      </div>
    </div>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
